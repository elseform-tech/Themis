[workspace]
resolver = "2"
members = ["crates/core", "crates/desktop"]
# cargo-fuzz targets build separately on nightly.
exclude = ["fuzz"]

# Browser recordings decode JPEG frames and encode H.264 in process; unoptimized,
# a few seconds of video take minutes in debug builds and tests.
[profile.dev.package.openh264-sys2]
opt-level = 3
[profile.dev.package.openh264]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3

# The shipped app carries no symbol tables: about a fifth of the binary (42 MB to 33 MB on
# macOS arm64). Panic messages keep their text and location; backtraces lose function names.
[profile.release]
strip = true
