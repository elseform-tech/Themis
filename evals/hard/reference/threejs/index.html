<!doctype html>
<html><head><meta charset="utf-8"><title>Night city</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#05070f}</style>
<script type="importmap">{"imports":{"three":"./vendor/three/three.module.min.js"}}</script>
</head><body>
<script type="module">
import * as THREE from "three";
import { createScene } from "./src/scene.js";
const { scene, camera, update } = createScene(THREE);
const renderer = new THREE.WebGLRenderer({ antialias: true });
document.body.appendChild(renderer.domElement);
const resize = () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); };
addEventListener("resize", resize); resize();
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => { update(clock.getElapsedTime()); renderer.render(scene, camera); });
</script></body></html>
