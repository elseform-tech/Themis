<!doctype html>
<meta charset="utf-8">
<!-- Grader-owned page: imports the agent's scene module and measures it. -->
<script type="importmap">{"imports":{"three":"./vendor/three/three.module.min.js"}}</script>
<pre id="probe">pending</pre>
<script type="module">
const out = document.getElementById("probe");
const fail = error => { out.textContent = JSON.stringify({error: String((error && error.stack) || error).slice(0, 600)}); };
window.addEventListener("error", event => fail(event.error || event.message));
window.addEventListener("unhandledrejection", event => fail(event.reason));
try {
  const THREE = await import("three");
  const mod = await import("./src/scene.js");
  const made = mod.createScene(THREE);
  const { scene, camera, update } = made;
  let buildings = 0, emissive = 0, lights = 0, pointish = 0;
  const heights = new Set();
  const box = new THREE.Box3();
  scene.updateMatrixWorld(true);
  scene.traverse(object => {
    if (object.isLight) {
      lights++;
      if (object.isDirectionalLight || object.isPointLight || object.isSpotLight) pointish++;
    }
    if (!object.isMesh) return;
    const materials = [].concat(object.material || []);
    if (materials.some(m => m && (m.emissiveMap || (m.emissive && m.emissive.getHex() > 0 && (m.emissiveIntensity ?? 1) > 0)))) emissive++;
    if (object.userData && object.userData.kind === "building") {
      if (object.isInstancedMesh) {
        const matrix = new THREE.Matrix4();
        for (let i = 0; i < object.count; i++) {
          object.getMatrixAt(i, matrix);
          object.geometry.computeBoundingBox();
          box.copy(object.geometry.boundingBox).applyMatrix4(matrix);
          heights.add(Math.round((box.max.y - box.min.y) * 10));
        }
        buildings += object.count;
      } else {
        box.setFromObject(object);
        heights.add(Math.round((box.max.y - box.min.y) * 10));
        buildings++;
      }
    }
  });
  if (update) update(0);
  const start = camera.position.clone();
  if (update) update(5);
  const moved = camera.position.distanceTo(start);
  const width = 320, height = 180;
  const canvas = document.createElement("canvas");
  canvas.width = width; canvas.height = height;
  const renderer = new THREE.WebGLRenderer({ canvas, preserveDrawingBuffer: true });
  renderer.setSize(width, height, false);
  if (camera.isPerspectiveCamera) { camera.aspect = width / height; camera.updateProjectionMatrix(); }
  renderer.render(scene, camera);
  const gl = renderer.getContext();
  const pixels = new Uint8Array(width * height * 4);
  gl.readPixels(0, 0, width, height, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
  let bright = 0, dark = 0;
  const colors = new Set();
  for (let i = 0; i < pixels.length; i += 4) {
    const luma = 0.2126 * pixels[i] + 0.7152 * pixels[i + 1] + 0.0722 * pixels[i + 2];
    if (luma > 150) bright++;
    if (luma < 50) dark++;
    colors.add((pixels[i] >> 3) << 10 | (pixels[i + 1] >> 3) << 5 | (pixels[i + 2] >> 3));
  }
  const total = width * height;
  out.textContent = JSON.stringify({
    buildings, heights: heights.size, emissive, lights, keyLights: pointish,
    fog: Boolean(scene.fog), moved: Number(moved.toFixed(3)),
    bright: Number((bright / total).toFixed(4)), dark: Number((dark / total).toFixed(4)), colors: colors.size,
  });
} catch (error) { fail(error); }
</script>
