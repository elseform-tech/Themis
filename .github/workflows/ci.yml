name: ci

# A PR runs once, on its pull_request event. main runs everything on push, so the jobs a PR
# skips (coverage, packaging when nothing about it changed) still run after the merge.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      web: ${{ steps.filter.outputs.web }}
      packaging: ${{ steps.filter.outputs.packaging }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            # The web and docs files listed are read by Rust tests (command_coverage,
            # live_coverage, configuration_diagnostics), so changing them can fail those tests.
            rust:
              - .github/workflows/ci.yml
              - Cargo.toml
              - Cargo.lock
              - rust-toolchain*
              - crates/**
              - evals/**
              - requirements-dev.txt
              - web/src/lib/tauri.ts
              - web/src/lib/browser.ts
              - web/src/screens/SettingsNav.tsx
              - web/src/screens/WorkspacePanel.tsx
              - web/src/screens/Sidebar.tsx
              - docs/configuration.md
              - docs/live-verification.md
            web:
              - .github/workflows/ci.yml
              - web/**
            packaging:
              - .github/workflows/ci.yml
              - Cargo.toml
              - Cargo.lock
              - crates/desktop/Cargo.toml
              - crates/desktop/build.rs
              - crates/desktop/tauri*.json
              - crates/desktop/capabilities/**
              - crates/desktop/icons/**
              - scripts/**
              - crates/desktop/tests/browser_permissions_cli_e2e.rs
              - crates/desktop/src/**/*searxng*
              - web/package.json
              - web/package-lock.json
              - web/vite.config.*

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        # The hosted Linux runner ships ~30 GB of SDKs this repo never uses; a full
        # workspace test build has filled the rest. Delete the unused ones by name.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Linux Tauri dependencies
        run: |
          sudo apt update
          sudo apt install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p themis-core --features eval --all-targets -- -D warnings

  rust-test:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Full debug info for every test binary is most of the build's size; line tables
      # still give file:line in panics and backtraces.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        # The hosted Linux runner ships ~30 GB of SDKs this repo never uses; a full
        # workspace test build has filled the rest. Delete the unused ones by name.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # A cold first Chrome start on the Windows runner (disk, antivirus) has taken longer than
      # the browser tests' 45 s start limit; start it once so the tests don't pay for it.
      - name: Warm up Chrome (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $chrome = "C:\Program Files\Google\Chrome\Application\chrome.exe"
          if (Test-Path $chrome) {
            $started = Get-Date
            $process = Start-Process -FilePath $chrome -ArgumentList '--headless=new','--disable-gpu','--no-first-run','--dump-dom','about:blank' -PassThru -WindowStyle Hidden
            if (-not $process.WaitForExit(120000)) { Stop-Process -Id $process.Id -Force }
            Write-Host ("Chrome warm-up took {0:N1} s" -f ((Get-Date) - $started).TotalSeconds)
          } else { Write-Host "Chrome not found at $chrome" }
      # A test that fails is run once more from the binary cargo built; one that then passes is
      # reported as FLAKY in the job summary and on the pull request instead of failing the job.
      # More than five failures, a failure on the re-run, or a build error still fail it.
      - name: Rust tests (a failed test is re-run once and reported as flaky)
        shell: bash
        run: |
          set +e
          cargo test --workspace --no-fail-fast -- --skip entered_keys_survive_new_store_and_can_be_forgotten 2>&1 | tee cargo-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            python scripts/ci_rerun_flaky.py cargo-test.log
            exit $?
          fi
      - name: Compaction eval plumbing (offline, scripted provider)
        run: cargo test -p themis-core --features eval --test compaction_eval
      - name: Compaction eval harness (offline end-to-end)
        if: runner.os == 'Linux'
        run: python -m unittest evals.compaction.test_harness
      - if: runner.os == 'Linux'
        run: python -m pip install -r requirements-dev.txt
      - name: Eval harnesses and shared eval kit (offline - generators, graders, trend, stand-in CLI)
        if: runner.os == 'Linux'
        run: python -m unittest evals.kit.test_kit evals.soak.test_harness evals.verify.test_harness evals.visions.test_harness

  # Runs the whole test suite again to produce a report, so it only runs on main.
  rust-coverage:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        # The hosted Linux runner ships ~30 GB of SDKs this repo never uses; a full
        # workspace test build has filled the rest. Delete the unused ones by name.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Install Linux Tauri dependencies
        run: |
          sudo apt update
          sudo apt install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Generate Rust LCOV
        run: |
          mkdir -p coverage
          cargo llvm-cov --workspace --lcov --output-path coverage/lcov.info -- --skip entered_keys_survive_new_store_and_can_be_forgotten
      - name: Verify dashboard reads Rust coverage
        run: python3 -c 'from quality_dashboard.dashboard import coverage_metrics; reports = coverage_metrics()["reports"]; assert any(report["scope"] == "Rust" for report in reports); print(reports)'
      - uses: actions/upload-artifact@v4
        with:
          name: rust-coverage-lcov
          path: coverage/lcov.info

  web:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  dashboard-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install -r requirements-dev.txt
      - run: cargo install rust-code-analysis-cli --version 0.0.25 --locked
      - run: ruff check quality_dashboard evals scripts
      - run: python -m unittest quality_dashboard.test_dashboard quality_dashboard.test_ratchets
      - run: python -m unittest discover -s scripts -p "test_*.py"
      # Size, complexity and repeated-code limits: new code meets them, old code only improves.
      - name: Code-health ratchets
        run: python -m quality_dashboard.ratchets
      - name: Verify AST dashboard metrics
        run: python -c 'from quality_dashboard.dashboard import complexity_metrics; metrics = complexity_metrics(); assert metrics["available"], metrics["error"]; print("Analyzed", metrics["filesAnalyzed"], "source files")'

  # The one check the main branch ruleset requires. A matrix job skipped by the path
  # filter reports a single unexpanded name (`rust-test`, not `rust-test (ubuntu-latest)`),
  # so requiring the matrix names would block every PR that skips them. This job fails
  # closed: the path filter must have succeeded, every job must pass, and a job may only
  # be skipped when the filter said its area did not change.
  ci-ok:
    if: always()
    needs: [changes, fmt, clippy, rust-test, web, dashboard-quality, tauri-build]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Every required job passed, or was skipped because its area did not change
        env:
          CHANGES: ${{ needs.changes.result }}
          FMT: ${{ needs.fmt.result }}
          DASHBOARD: ${{ needs.dashboard-quality.result }}
          CLIPPY: ${{ needs.clippy.result }}
          RUST_TEST: ${{ needs.rust-test.result }}
          WEB: ${{ needs.web.result }}
          TAURI_BUILD: ${{ needs.tauri-build.result }}
          RUST_CHANGED: ${{ github.event_name == 'push' || needs.changes.outputs.rust == 'true' }}
          WEB_CHANGED: ${{ github.event_name == 'push' || needs.changes.outputs.web == 'true' }}
          PACKAGING_CHANGED: ${{ github.event_name == 'push' || needs.changes.outputs.packaging == 'true' }}
        run: |
          failed=0
          # name, result, whether the job had to run
          check() {
            echo "$1: $2 (required to run: $3)"
            if [ "$2" = "success" ]; then return; fi
            if [ "$2" = "skipped" ] && [ "$3" = "false" ]; then return; fi
            echo "  -> $1 did not pass"
            failed=1
          }
          check changes "$CHANGES" true
          check fmt "$FMT" true
          check dashboard-quality "$DASHBOARD" true
          check clippy "$CLIPPY" "$RUST_CHANGED"
          check rust-test "$RUST_TEST" "$RUST_CHANGED"
          check web "$WEB" "$WEB_CHANGED"
          check tauri-build "$TAURI_BUILD" "$PACKAGING_CHANGED"
          exit $failed

  tauri-build:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.packaging == 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        # The hosted Linux runner ships ~30 GB of SDKs this repo never uses; a full
        # workspace test build has filled the rest. Delete the unused ones by name.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: astral-sh/setup-uv@v5
      - run: npm ci
        working-directory: web
      # Packs the built-in SearXNG (standalone Python) into crates/desktop/searxng-runtime and
      # ships it: only release builds add it (tauri.searxng.conf.json), so ordinary cargo
      # builds and tests do not need it. SearXNG does not run on Windows (it needs the Unix
      # `pwd` module), so Windows builds ship without it; web_search there uses a server
      # address set in Settings › Web.
      - if: runner.os != 'Windows'
        run: node scripts/bundle-searxng.mjs
      - if: runner.os != 'Windows'
        run: npx -y @tauri-apps/cli@2 build --config tauri.searxng.conf.json
        working-directory: crates/desktop
      - if: runner.os == 'Windows'
        run: npx -y @tauri-apps/cli@2 build
        working-directory: crates/desktop
      # The Windows bundle ships the console `themis` CLI next to the app (tauri.windows.conf.json,
      # staged by scripts/stage-cli.mjs): the copy tauri-build made must be the real one, not
      # build.rs's empty stand-in.
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cli = Get-Item target/release/themis-cli.exe
          if ($cli.Length -eq 0) { throw "themis-cli.exe is the empty stand-in" }
          & $cli.FullName --version
      # The packaged app's search server starts and answers (uses the built runtime).
      - if: runner.os != 'Windows'
        run: cargo test -p themis-desktop --test browser_permissions_cli_e2e cli_the_built_in_search_server_answers -- --nocapture
