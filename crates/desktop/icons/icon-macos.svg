<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Themis Visions">
  <!-- Apple's macOS icon template: an 824×824 body centred on 1024 (100px transparent margin), corner radius 185,
       a soft shadow inside the margin. The body is the dark tile of icon.svg scaled 4.12×. -->
  <defs>
    <linearGradient id="tg-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity=".3"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#0B0F1D" filter="url(#shadow)"/>
  <g transform="translate(100 100) scale(4.12)">
    <path d="M32 44H168L154 68H112V124L100 144L88 124V68H46Z" fill="url(#tg-dark)"/>
    <path d="M39 58L63 58L100 122L137 58L161 58L100 164Z" fill="#EBF3FF" fill-opacity=".9"/>
  </g>
</svg>
