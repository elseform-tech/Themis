[package]
name = "themis-desktop"
default-run = "themis-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled", "blob"] }
tauri = { version = "2", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
themis-core = { path = "../core" }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time", "signal"] }
uuid = { version = "1", features = ["v4"] }
rpassword = "7.5.4"
zeroize = "1"
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Exposes internal parsers to the `fuzz/` cargo-fuzz targets; never enabled in releases.
fuzzing = []

[dev-dependencies]
proptest = "1"
# The progress hook lets scale tests count SQLite's steps.
rusqlite = { version = "0.32", features = ["hooks"] }
tempfile = "3"
wiremock = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
block2 = "0.6.2"
objc2 = "0.6.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSHapticFeedback", "NSImage"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSBundle", "NSData", "NSDictionary", "NSError", "NSString", "NSUserDefaults", "NSValue"] }
objc2-user-notifications = { version = "0.3.2", default-features = false, features = ["std", "block2", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSettings", "UNNotificationTrigger", "UNUserNotificationCenter"] }
security-framework = "3.7"
security-framework-sys = "2.17"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["sync-secret-service"] }
