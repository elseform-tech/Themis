[package]
name = "themis-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"

[dependencies]
anyhow = "1"
libc = "0.2"
futures-util = "0.3"
httpdate = "1"
autoagents = "0.4"
autoagents-derive = "0.4"
autoagents-toolkit = { version = "0.4", features = ["filesystem"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "time"] }

[features]
# Exposes internal parsers to the `fuzz/` cargo-fuzz targets; never enabled in releases.
fuzzing = []
# Compaction-quality eval entry points (`runtime::eval`); never enabled in releases.
eval = []

[dev-dependencies]
proptest = "1"
tempfile = "3"
wiremock = "0.6"

[[example]]
name = "compaction_eval"
required-features = ["eval"]

[[test]]
name = "compaction_eval"
required-features = ["eval"]
