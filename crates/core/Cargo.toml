[package]
name = "themis-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
libc = "0.2"
futures-util = "0.3"
httpdate = "1"
autoagents = "0.4"
autoagents-derive = "0.4"
autoagents-toolkit = { version = "0.4", features = ["filesystem"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
dom_smoothie = "0.18"
encoding_rs = "0.8"
htmd = "0.5"
base64 = "0.23"
mp4 = "0.14"
openh264 = "0.9"
zune-jpeg = "0.5"
bytes = "1"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "time", "sync", "fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects"] }

[features]
# Exposes internal parsers to the `fuzz/` cargo-fuzz targets; never enabled in releases.
fuzzing = []
# Compaction-quality eval entry points (`runtime::eval`); never enabled in releases.
eval = []

[dev-dependencies]
proptest = "1"
# Virtual time for deadline tests (tests only).
tokio = { version = "1", features = ["test-util"] }
tempfile = "3"
wiremock = "0.6"

[[example]]
name = "compaction_eval"
required-features = ["eval"]

[[example]]
name = "behavior_eval"
required-features = ["eval"]

[[test]]
name = "compaction_eval"
required-features = ["eval"]

[[example]]
name = "longform_eval"
required-features = ["eval"]

[lints.rust]
# Set by the eval harnesses when the tree has the `recall` tool (older refs do not).
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(eval_recall)'] }

[[example]]
name = "tool_eval"
required-features = ["eval"]
