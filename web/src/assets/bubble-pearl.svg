<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192" role="img" aria-labelledby="title desc"><title id="title">Themis Pearl bubble</title><desc id="desc">A round, glossy pearl bubble blob with bright eyes, no mouth and a small floating bubble on a sprout. No human body or limbs.</desc><defs><radialGradient id="body" cx=".3" cy=".25" r=".85"><stop stop-color="#ffffff" /><stop offset=".55" stop-color="#dfe4ee" /><stop offset="1" stop-color="#9aa3b8" /></radialGradient></defs><style>.blob{animation:breathe 4.5s ease-in-out infinite;transform-origin:92px 166px}.eyes{animation:blink 6s infinite;transform-origin:93px 100px}@keyframes breathe{50%{transform:translateY(-3px) scale(1.02,.98)}}@keyframes blink{0%,44%,48%,100%{transform:scaleY(1)}46%{transform:scaleY(.1)}}@media(prefers-reduced-motion:reduce){.blob,.eyes{animation:none}}</style><ellipse cx="94" cy="177" rx="44" ry="5" fill="#000000" opacity=".22" /><g class="blob" stroke-linecap="round" stroke-linejoin="round"><g class="head"><path d="M94 40Q91 30 98 24" fill="none" stroke="#e6b84f" stroke-width="2.5" /><circle cx="100" cy="17" r="8.5" fill="#ffffff" fill-opacity=".12" stroke="#ffffff" stroke-width="2" /><circle cx="97" cy="14" r="2" fill="#ffffff" opacity=".85" /><path d="M34 109C30 68 50 41 88 39C129 34 150 68 151 107C154 144 130 165 93 166C55 167 35 147 34 109Z" fill="url(#body)" /><path d="M34 109C30 68 50 41 88 39C129 34 150 68 151 107C154 144 130 165 93 166C55 167 35 147 34 109Z" fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-width="2" /><ellipse cx="62" cy="72" rx="15" ry="9" transform="rotate(-35 62 72)" fill="#ffffff" opacity=".7" /><circle cx="84" cy="56" r="4" fill="#ffffff" opacity=".85" /><path d="M136 120Q134 140 118 152" fill="none" stroke="#ffffff" stroke-width="3" opacity=".3" /><g fill="#ef8f6b" opacity=".38"><ellipse cx="63" cy="115" rx="8" ry="5" /><ellipse cx="123" cy="115" rx="8" ry="5" /></g><g class="gaze"><g class="eyes" fill="#28303c"><ellipse cx="78" cy="100" rx="5.5" ry="7.5" /><ellipse cx="108" cy="100" rx="5.5" ry="7.5" /><circle cx="80" cy="97" r="2" fill="#ffffff" /><circle cx="110" cy="97" r="2" fill="#ffffff" /></g></g></g></g></svg>
