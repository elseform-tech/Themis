<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192" role="img" aria-labelledby="title desc"><title id="title">Themis Honey blob knight</title><desc id="desc">A mouthless round honey blob with expressive eyes, a small metal helmet and shield. No human body or limbs. Gold scales on the shield.</desc><defs><radialGradient id="body" cx=".3" cy=".23" r=".82"><stop stop-color="#fff0ae" /><stop offset=".6" stop-color="#eac660" /><stop offset="1" stop-color="#b1893b" /></radialGradient><linearGradient id="metal" x2=".8" y2="1"><stop stop-color="#edf1f6" /><stop offset=".4" stop-color="#bcc8d5" /><stop offset="1" stop-color="#4d5b6c" /></linearGradient></defs><style>.blob{animation:breathe 5s ease-in-out infinite;animation-delay:-0.8s;transform-origin:92px 150px}.eyes{animation:blink 6.7s infinite;animation-delay:-1.3s;transform-origin:92px 94px}.feather{animation:sway 5s ease-in-out infinite;transform-origin:96px 39px}@keyframes breathe{50%{transform:translateY(-3px) scale(1.015,.985)}}@keyframes blink{0%,44%,48%,100%{transform:scaleY(1)}46%{transform:scaleY(.1)}}@keyframes sway{50%{transform:rotate(6deg)}}@media(prefers-reduced-motion:reduce){.blob,.eyes,.feather{animation:none}}.head{transform-origin:92px 108px;transition:transform .18s ease-out}.gaze{transition:transform .18s ease-out}@media(prefers-reduced-motion:reduce){.head,.gaze{transition:none}}</style><ellipse cx="94" cy="177" rx="49" ry="5" fill="#667383" opacity=".12" /><g class="blob" stroke-linecap="round" stroke-linejoin="round"><g class="head"><path d="M34 109C30 68 50 41 88 39C129 34 150 68 151 107C154 144 130 165 93 166C55 167 35 147 34 109Z" fill="url(#body)" /><path d="M46 108Q44 84 54 73" fill="none" stroke="#fff0ae" stroke-width="3" opacity=".55" /><path d="M89 39V24Q96 16 103 24V39" fill="#f1e3bc" /><path d="M48 68Q48 40 91 36Q135 38 137 68Q94 53 48 68Z" fill="url(#metal)" /><path d="M49 68Q93 51 137 68" fill="none" stroke="#f1e3bc" stroke-width="4" /><path d="M92 35V58" stroke="#f4f7fb" opacity=".5" stroke-width="2" /><path d="M64 49Q72 42 81 42" fill="none" stroke="#fff" opacity=".65" stroke-width="2" /><path d="M49 56Q29 52 31 36L52 47M134 56Q154 52 152 36L131 47" fill="url(#metal)" stroke="#e6b84f" stroke-width="1.5" /><g class="gaze"><g class="eyes" fill="#28303c" stroke="#28303c"><path d="M73 97Q79 87 85 97M99 97Q105 87 111 97" stroke-width="4" fill="none" /></g></g></g><path d="M131 117L156 125V143Q154 162 131 173Q108 162 106 143V125Z" fill="url(#metal)" stroke="#f1e3bc" stroke-width="3" /><path d="M113 130V140" stroke="#fff" opacity=".5" stroke-width="2" /><g class="scales" fill="none" stroke="#E6B84F" stroke-width="1.8"><path d="M131 131V154M124 155H138M119 136H143" /><path d="M122 136L117 145H127Z" /><path d="M140 136L135 145H145Z" /><circle cx="131" cy="131" r="2" fill="#F9D987" stroke="none" /></g></g></svg>
